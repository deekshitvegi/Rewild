<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cloud lab</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #eef2f7;
    --ink-2: rgba(238, 242, 247, 0.72);
    --ink-3: rgba(238, 242, 247, 0.5);
    --glass: rgba(14, 18, 26, 0.5);
    --edge: rgba(255, 255, 255, 0.14);
    --accent: #ffb547;
    background: #05070b;
  }
  html, body, #root { margin: 0; height: 100%; }
  body { background: #05070b; color: var(--ink); font: 500 13px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  .stage:active { cursor: grabbing; }
  .panel {
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 300px; box-sizing: border-box;
    display: grid; gap: 12px; padding: 14px 16px 16px;
    background: var(--glass); border: 1px solid var(--edge); border-radius: 20px;
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  }
  .panel--closed { padding-bottom: 14px; }
  header { display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0; flex: 1; }
  .rate { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }
  .toggle, .quality button {
    font: inherit; color: var(--ink-2); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge);
    border-radius: 10px; padding: 5px 10px; cursor: pointer;
  }
  .hint { margin: 0; color: var(--ink-2); }
  label { display: grid; gap: 6px; }
  label span { display: flex; justify-content: space-between; color: var(--ink-2); }
  label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
  .quality { display: flex; gap: 6px; }
  .quality button { flex: 1; }
  .quality button[aria-checked="true"] { color: #1a1206; background: var(--accent); border-color: var(--accent); }
  .status { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; color: var(--ink-2); font-size: 14px; pointer-events: none; }
  @media (max-width: 480px) {
    .panel { left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body><div id="root"></div><script type="module" src="./cloud-play.tsx"></script></body>
</html>
